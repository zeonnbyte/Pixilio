name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pixilio.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/pixilio.jks" >> "$GITHUB_ENV"
            echo "Keystore dipasang, APK akan ditandatangani"
          else
            echo "Secret keystore tidak ada, pakai debug key"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Pixilio APK
          path: app/build/outputs/apk/release/*.apk

      - name: Publish ke GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/*.apk "Pixilio V$VER.apk"

          # Versi ada alpha/beta/rc/dev = pre-release, selain itu = release biasa
          case "$VER" in
            *alpha*|*beta*|*-rc*|*dev*) FLAG="--prerelease"; echo "Tipe: pre-release ($VER)" ;;
            *)                          FLAG="--latest";     echo "Tipe: release stabil ($VER)" ;;
          esac

          if gh release view "v$VER" > /dev/null 2>&1; then
            gh release upload "v$VER" "Pixilio V$VER.apk" --clobber
            gh release edit "v$VER" $FLAG
          else
            gh release create "v$VER" "Pixilio V$VER.apk" \
              --target "$GITHUB_SHA" --title "Pixilio V$VER" \
              --generate-notes $FLAG
          fi
